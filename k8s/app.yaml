apiVersion: v1
kind: Service
metadata:
  name: blog-svc
spec:
  type: NodePort
  selector:
    app: blog-pod
  ports:
    - name: app-port-mapping
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-pod
  template:
    metadata:
      labels:
        app: blog-pod
    spec:
      containers:
        - name: blog
          image: your_dockerhub_username/blog
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: db_jdbc_url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: db_username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: db_password
            - name: EMAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: email_host
            - name: EMAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: email_port
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: redis_host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: redis_port
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: rabbitmq_host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: rabbitmq_port
            - name: TRACING_ENABLED
              value: "true"
            - name: METRICS_EXPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: metrics_export_url
            - name: TRACES_EXPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: traces_export_url
            - name: LOGS_EXPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-configmap
                  key: logs_export_url
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 240
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 240
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 10" ]
