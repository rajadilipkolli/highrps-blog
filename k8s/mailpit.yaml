apiVersion: v1
kind: Service
metadata:
  name: blog-mailpit-svc
spec:
  selector:
    app: blog-mailpit-pod
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-mailpit-deployment
spec:
  selector:
    matchLabels:
      app: blog-mailpit-pod
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blog-mailpit-pod
    spec:
      containers:
        - name: mailpit
          image: "axllent/mailpit:v1.31"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
